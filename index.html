<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open link in App?</title>
  <meta name="description" content="Click to open this link directly in the app, or continue to the store." />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn, etc.) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Open link in App?" />
  <meta property="og:description" content="Click to open this link directly in the app, or continue to the store." />
  <meta property="og:url" content="https://dev.d3swcvd4wd9xrg.amplifyapp.com/" />
  <meta property="og:image" content="https://dbuhveqapzlhb.cloudfront.net/common_assets/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Test03" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Open link in App?" />
  <meta name="twitter:description" content="Click to open this link directly in the app, or continue to the store." />
  <meta name="twitter:image" content="https://dbuhveqapzlhb.cloudfront.net/common_assets/icons/og-image.png" />

  <!-- Placeholder favicon; will be replaced by JS -->
  <link id="favicon" rel="icon" href="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Open link in App?</h1>
      <p>Click the button below to open the app or continue to the store.</p>
      <button id="openAppBtn" class="open-btn">Open</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="utils.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.ENV && window.ENV.CLOUDFRONT_URL) {
        document.getElementById("favicon").href =
          `${window.ENV.CLOUDFRONT_URL}/common_assets/icons/favicon.ico`;
      }
    });
  </script>

  <script src="script.js"></script>
</body>
</html>
